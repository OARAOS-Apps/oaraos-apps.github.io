<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Oaraos Test Programı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a short how-to strip, then a checklist grid of 24 app tickets the tester works through. */
:root{
  --bg:#F2F4F7; --card:#FFFFFF; --ink:#152030; --muted:#5A6676; --line:#DCE1E8;
  --accent:#2B54D9; --on-accent:#FFFFFF; --done:#1F8A5B; --done-soft:#E3F3EA;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Figtree", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --card:#161D26; --ink:#E6EBF1; --muted:#94A1B1; --line:#263140;
  --accent:#7D9BFF; --on-accent:#0B1430; --done:#5CCB97; --done-soft:#14291F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --card:#161D26; --ink:#E6EBF1; --muted:#94A1B1; --line:#263140;
  --accent:#7D9BFF; --on-accent:#0B1430; --done:#5CCB97; --done-soft:#14291F; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;gap:36px}
header{display:grid;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:600 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:6px 14px;font:600 13px/1 var(--body);color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible,.join:focus-visible,.tick:focus-visible,.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font:800 clamp(30px,5vw,48px)/1.05 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance;max-width:18ch}
.lede{margin:0;max-width:62ch;color:var(--muted);font-size:17px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;counter-reset:s}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;display:grid;gap:6px;min-width:0}
.steps li::before{content:counter(s);font:800 22px/1 var(--display);color:var(--accent)}
.steps b{font-weight:600}
.steps span{color:var(--muted);font-size:15px}
.note{margin:0;font-size:14px;color:var(--muted);max-width:70ch}
.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.bar h2{font:800 22px/1.2 var(--display);margin:0;flex:1 1 auto}
.count{font:600 15px/1 var(--body);font-variant-numeric:tabular-nums}
.meter{flex:0 0 160px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.app{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:56px 1fr;gap:12px 14px;align-items:start;min-width:0}
.app.done{border-color:var(--done);background:linear-gradient(var(--done-soft),var(--done-soft)) padding-box}
.app img{width:56px;height:56px;border-radius:14px}
.app h3{margin:0;font:600 16px/1.3 var(--body)}
.app p{margin:4px 0 0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.actions{grid-column:1 / -1;display:flex;gap:8px;align-items:center;justify-content:space-between}
.join{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;background:var(--accent);color:var(--on-accent);font:600 14px/1 var(--body);text-decoration:none}
.tick{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.tick input{width:18px;height:18px;accent-color:var(--done);margin:0}
.app.done .tick{color:var(--done);font-weight:600}
footer{display:grid;gap:8px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px}
.mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mail code{font:500 14px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:6px 8px;border-radius:8px;user-select:all}
.copy{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--accent)}
@media (max-width:520px){.meter{flex-basis:100%}}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <span class="brand">Oaraos · Google Play</span>
      <div class="lang" role="group" aria-label="Language">
        <button id="l-tr" type="button" aria-pressed="true">TR</button>
        <button id="l-en" type="button" aria-pressed="false">EN</button>
      </div>
    </div>
    <h1 data-t="title"></h1>
    <p class="lede" data-t="lede"></p>
  </header>

  <section aria-labelledby="how">
    <h2 id="how" hidden data-t="howTitle"></h2>
    <ol class="steps">
      <li><b data-t="s1"></b><span data-t="s1d"></span></li>
      <li><b data-t="s2"></b><span data-t="s2d"></span></li>
      <li><b data-t="s3"></b><span data-t="s3d"></span></li>
      <li><b data-t="s4"></b><span data-t="s4d"></span></li>
    </ol>
    <p class="note" data-t="note" style="margin-top:12px"></p>
  </section>

  <section aria-labelledby="list" style="display:grid;gap:14px">
    <div class="bar">
      <h2 id="list" data-t="listTitle"></h2>
      <span class="count" id="count">0 / 24</span>
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    <span data-t="privacy"></span>
    <div class="mail"><span data-t="contact"></span><code id="mail">oaraos.support@gmail.com</code><button class="copy" id="copy" type="button" data-t="copy"></button></div>
  </footer>
</div>

let lang=(navigator.language||"tr").slice(0,2)==="tr"?"tr":"en", done={};
try{const s=JSON.parse(localStorage.getItem("oaraos-tester")||"{}");if(s.lang)lang=s.lang;if(s.done)done=s.done}catch(e){}
function save(){try{localStorage.setItem("oaraos-tester",JSON.stringify({lang,done}))}catch(e){}}
const grid=document.getElementById("grid");
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t[el.dataset.t]});
  document.getElementById("l-tr").setAttribute("aria-pressed",lang==="tr");
  document.getElementById("l-en").setAttribute("aria-pressed",lang==="en");
  grid.innerHTML="";
  APPS.forEach((a,i)=>{
    const card=document.createElement("article");card.className="app"+(done[a.pkg]?" done":"");
    card.innerHTML=`<img alt="" src="${a.icon}"><div style="min-width:0"><h3></h3><p></p></div>
      <div class="actions"><a class="join" target="_blank" rel="noopener" href="https://play.google.com/apps/testing/${a.pkg}"></a>
      <label class="tick"><input type="checkbox" id="t-${i}"><span></span></label></div>`;
    card.querySelector("h3").textContent=lang==="tr"?a.tr_name:a.en_name;
    card.querySelector("p").textContent=lang==="tr"?a.tr_short:a.en_short;
    card.querySelector(".join").textContent=t.join+" ↗";
    card.querySelector(".tick span").textContent=t.tick;
    const cb=card.querySelector("input");cb.checked=!!done[a.pkg];
    cb.addEventListener("change",()=>{done[a.pkg]=cb.checked;if(!cb.checked)delete done[a.pkg];card.classList.toggle("done",cb.checked);save();progress()});
    grid.appendChild(card);
  });
  progress();
}
function progress(){const n=APPS.filter(a=>done[a.pkg]).length;
  document.getElementById("count").textContent=`${n} / ${APPS.length}`;
  document.getElementById("meter").style.width=(n/APPS.length*100)+"%";}
document.getElementById("l-tr").onclick=()=>{lang="tr";save();render()};

  try{await navigator.clipboard.writeText("oaraos.support@gmail.com");b.textContent=T[lang].copied}
  catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById("mail"));const s=getSelection();s.removeAllRanges();s.addRange(r)}};
render();
